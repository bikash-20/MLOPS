name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          ruff check src tests

      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          file: coverage.xml
          fail_ci_if_error: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t neural-network:ci .

      - name: Smoke test container
        run: |
          docker run --rm -d --name wine-api-test -p 8000:8000 neural-network:ci
          sleep 8
          curl -sf http://localhost:8000/health || (docker logs wine-api-test && exit 1)
          docker stop wine-api-test

  deploy-modal:
    name: Deploy to Modal (serverless)
    # Only deploy on direct pushes to main (not on PRs from forks) and
    # only if lint + tests + docker build all passed. Use workflow_dispatch
    # for manual deploys.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-and-test, docker-build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ github.event.repository.owner }}--neural-network-api-fastapi-app.modal.run
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install modal CLI
        run: |
          python -m pip install --upgrade pip
          pip install 'modal>=0.63,<2.0'

      - name: Configure modal token
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          # Modal's CLI picks up the env vars automatically; no `modal token new` needed.
          modal --version

      - name: Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal deploy deploy/modal_app.py

      - name: Smoke test the deployed URL
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          URL="https://${{ github.event.repository.owner }}--neural-network-api-fastapi-app.modal.run"
          sleep 10
          curl -sf "${URL}/health" && echo
          curl -sf "${URL}/model/info"  && echo
          curl -sf "${URL}/models"      && echo
