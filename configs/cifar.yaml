# CIFAR-10 training config — single-file, fully self-contained.
# Override any value from the CLI:
#   python -m src.training.train_cifar train.epochs=5 model.dropout=0.3
#   python -m src.training.train_cifar train.learning_rate=0.05 train.weight_decay=1e-4

project: cifar10

data:
  val_size: 0.1
  random_seed: 42

model:
  name: cifar_resnet18
  in_channels: 3
  num_classes: 10
  base_channels: 64
  num_blocks_per_stage: 2
  dropout: 0.2

train:
  learning_rate: 0.1
  epochs: 20
  batch_size: 128
  weight_decay: 0.0005
  momentum: 0.9
  log_every: 1
  scheduler: one_cycle
  pct_start: 0.1
  early_stop_patience: 5
  min_acc_delta: 0.0
  num_workers: 0
  mlflow_tracking_uri: null
  mlflow_experiment: cifar10-resnet
